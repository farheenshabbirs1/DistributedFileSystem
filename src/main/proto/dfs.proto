syntax = "proto3";

package dfs;

option java_package = "com.farheenshaikh.dfs.proto";
option java_outer_classname = "DfsProto";

// Every RPC to a storage node is one NodeRequest sent over a TCP socket,
// framed with a varint length prefix (see Message.writeDelimitedTo /
// parseDelimitedFrom), and answered with exactly one NodeResponse framed
// the same way.

message NodeRequest {
  oneof payload {
    StoreChunkRequest store = 1;
    ReadChunkRequest read = 2;
    HeartbeatRequest heartbeat = 3;
    CorruptChunkRequest corrupt = 4; // test/demo-only fault injection hook
  }
}

message NodeResponse {
  oneof payload {
    StoreChunkResponse store = 1;
    ReadChunkResponse read = 2;
    HeartbeatResponse heartbeat = 3;
    CorruptChunkResponse corrupt = 4;
  }
}

message StoreChunkRequest {
  string chunk_id = 1;
  bytes data = 2;
}

message StoreChunkResponse {
  bool success = 1;
  string checksum = 2;
}

message ReadChunkRequest {
  string chunk_id = 1;
}

message ReadChunkResponse {
  enum Status {
    OK = 0;
    NOT_FOUND = 1;
    CORRUPTED = 2;
  }
  Status status = 1;
  bytes data = 2;
}

message HeartbeatRequest {
  string requester_id = 1;
}

message HeartbeatResponse {
  string node_id = 1;
  int64 server_time_millis = 2;
}

// Simulates on-disk corruption of a chunk, for demos and tests -- flips a
// byte in the stored copy so its checksum no longer matches.
message CorruptChunkRequest {
  string chunk_id = 1;
}

message CorruptChunkResponse {
  bool success = 1;
}
